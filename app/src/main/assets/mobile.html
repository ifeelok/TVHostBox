<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B111C">
<meta name="format-detection" content="telephone=no">
<title>电视Host管家 · 手机配置</title>
<style>
  :root{
    --bg:#0B111C; --panel:#141C29; --panel2:#1A2331;
    --line:#26334A; --text:#E8EDF6; --sub:#93A1B8;
    --accent:#4FC3F7; --primary:#2F7CF6; --danger:#EF5350; --ok:#4ADE80;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, #16253C 0%, rgba(11,17,28,0) 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;
    font-size:15px;line-height:1.55;
    min-height:100vh;
    overflow-x:hidden; /* 防个别长文本把页面撑出横向滚动 */
    padding:0 14px calc(26px + env(safe-area-inset-bottom));
  }
  main{max-width:560px;margin:0 auto}

  /* ---------- 顶栏 ---------- */
  .top{
    max-width:560px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(18px + env(safe-area-inset-top)) 2px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(140deg,#4FC3F7,#2F7CF6 70%);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:19px;color:#08131F;
    box-shadow:0 6px 16px rgba(47,124,246,.35);
  }
  .brand h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px}
  .brand p{margin:1px 0 0;font-size:12px;color:var(--sub);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .pill{
    flex:none;font-size:12px;padding:5px 10px;border-radius:999px;
    background:rgba(74,222,128,.12);color:var(--ok);
    border:1px solid rgba(74,222,128,.28);white-space:nowrap;
  }
  .pill.err{background:rgba(239,83,80,.12);color:var(--danger);border-color:rgba(239,83,80,.3)}

  /* ---------- 卡片 ---------- */
  .card{
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.22);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .card-head h2{font-size:14px;margin:0;font-weight:600;color:var(--text);letter-spacing:.4px}
  .count{
    font-size:12px;color:var(--accent);background:rgba(79,195,247,.12);
    border:1px solid rgba(79,195,247,.25);border-radius:999px;padding:2px 9px;
  }

  /* ---------- 条目列表 ---------- */
  .list{list-style:none;margin:0;padding:0;max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .item{
    display:flex;align-items:center;gap:8px;
    padding:10px 10px;border-radius:10px;
    background:rgba(255,255,255,.02);
    border:1px solid transparent;
    margin-bottom:7px;
    transition:background .15s,border-color .15s;
  }
  .item:last-child{margin-bottom:0}
  .item.active{background:rgba(79,195,247,.09);border-color:rgba(79,195,247,.42)}
  .item .meta{min-width:0;flex:1}
  .item .host{
    font-size:14px;font-weight:600;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .item .ip{
    font-size:12.5px;color:var(--sub);margin-top:1px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .item .ip b{color:var(--accent);font-weight:600}
  .del{
    flex:none;width:34px;height:34px;border-radius:9px;
    background:rgba(239,83,80,.10);border:1px solid rgba(239,83,80,.22);
    color:var(--danger);font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:background .15s;
  }
  .del:active{background:rgba(239,83,80,.28)}
  /* 备份行：右侧三个小按钮（恢复 / 改名 / 删除） */
  .acts{display:flex;gap:6px;flex:none}
  .act{
    height:34px;padding:0 11px;border-radius:9px;
    background:rgba(79,195,247,.10);border:1px solid rgba(79,195,247,.22);
    color:var(--accent);font-size:13px;line-height:1;
  }
  .act:active{background:rgba(79,195,247,.26)}
  .act.warn{background:rgba(239,83,80,.10);border-color:rgba(239,83,80,.24);color:var(--danger)}
  .act.warn:active{background:rgba(239,83,80,.28)}
  button.ghost.danger{color:var(--danger);border-color:rgba(239,83,80,.32)}
  /* 备份项：上面一行是名字+按钮，点「看」把内容展开在这一项里 */
  .item.bk{display:block;padding:0;overflow:hidden}
  .bkrow{display:flex;align-items:center;gap:8px;padding:10px}
  pre.raw{
    margin:0;padding:10px;
    border-top:1px solid var(--line);
    background:#0A121D;color:#CFE0FF;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12.5px;line-height:1.6;
    white-space:pre;overflow:auto;-webkit-overflow-scrolling:touch;
    max-height:40vh;
  }
  .empty{
    text-align:center;color:var(--sub);font-size:13px;
    padding:22px 8px;line-height:1.8;
  }
  .hint{color:var(--sub);font-size:12px;margin:10px 0 0}

  /* ---------- 表单 ---------- */
  .field{display:block;margin-bottom:11px}
  .field span{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;letter-spacing:.3px}
  input[type=text],input:not([type]){
    width:100%;height:46px;padding:0 12px;
    background:#0E1622;color:var(--text);
    border:1px solid var(--line);border-radius:10px;
    font-size:16px; /* 16px 可避免 iOS 聚焦自动放大 */
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    outline:none;transition:border-color .15s,box-shadow .15s;
  }
  input::placeholder{color:#5A6B85;font-family:inherit}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,195,247,.14)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px}
  .chip{
    display:inline-block; /* inline 元素的 max-width 不生效，会把页面撑宽 */
    max-width:100%;
    font-size:12px;padding:6px 10px;border-radius:999px;
    background:rgba(79,195,247,.08);color:var(--accent);
    border:1px solid rgba(79,195,247,.22);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    cursor:pointer;
  }
  .chip:active{background:rgba(79,195,247,.22)}

  button{font-family:inherit;border:0;cursor:pointer}
  .primary{
    width:100%;height:48px;border-radius:11px;
    background:linear-gradient(135deg,#3E8BFF,#2F7CF6);
    color:#fff;font-size:16px;font-weight:600;letter-spacing:.5px;
    box-shadow:0 8px 20px rgba(47,124,246,.28);
    transition:transform .12s,filter .15s;
  }
  .primary:active{transform:scale(.985);filter:brightness(1.08)}
  .primary:disabled{opacity:.55;box-shadow:none}
  .ghost{
    height:44px;padding:0 16px;border-radius:11px;
    background:transparent;color:var(--sub);
    border:1px solid var(--line);font-size:14px;
  }
  .row{display:flex;gap:9px;margin-top:11px}
  .row .primary{flex:1}

  /* ---------- 全文编辑 ---------- */
  details.card{padding:0;overflow:hidden}
  details.card>summary{
    list-style:none;cursor:pointer;
    padding:14px;font-size:14px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;
  }
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary::after{
    content:"展开";font-size:12px;font-weight:400;color:var(--sub);
    border:1px solid var(--line);border-radius:999px;padding:2px 9px;
  }
  details[open].card>summary::after{content:"收起"}
  details .body{padding:0 14px 14px}
  textarea{
    width:100%;height:38vh;min-height:180px;padding:11px;
    background:#0A121D;color:#CFE0FF;
    border:1px solid var(--line);border-radius:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:13px;line-height:1.65;
    white-space:pre;overflow:auto; /* 不自动换行，长行横向滚动 */
    outline:none;resize:vertical;
  }
  textarea:focus{border-color:var(--accent)}

  footer{
    max-width:560px;margin:0 auto;padding:2px 4px;
    color:#5C6B82;font-size:11.5px;text-align:center;line-height:1.7;
  }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    max-width:calc(100vw - 40px);
    padding:10px 16px;border-radius:11px;
    background:rgba(24,34,48,.96);
    border:1px solid var(--line);
    color:var(--text);font-size:13.5px;text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,.45);
    opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.ok{border-color:rgba(74,222,128,.4);color:#B8F5CE}
  #toast.err{border-color:rgba(239,83,80,.45);color:#FFC9C7}

  @media (min-width:620px){
    body{font-size:15.5px}
    .list{max-height:38vh}
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="logo">H</div>
    <div>
      <h1>电视Host管家</h1>
      <p id="boxIp">连接中…</p>
    </div>
  </div>
  <div class="pill" id="pill">连接中</div>
</header>

<main>
  <section class="card">
    <div class="card-head">
      <h2>当前 hosts 条目</h2>
      <span class="count" id="count">0 条</span>
    </div>
    <ul class="list" id="list"><li class="empty">正在读取盒子上的 hosts…</li></ul>
    <p class="hint">点一条可带入下方编辑，点 ✕ 直接删除（写入前自动备份）</p>
  </section>

  <section class="card">
    <div class="card-head"><h2>写入 / 替换解析</h2></div>
    <label class="field"><span>IP 地址</span>
      <input id="ip" inputmode="decimal" autocomplete="off" autocapitalize="off"
             placeholder="104.17.142.159">
    </label>
    <label class="field"><span>域名</span>
      <input id="domain" list="domains" autocomplete="off" autocapitalize="off"
             placeholder="emby.example.com">
    </label>
    <datalist id="domains"></datalist>
    <div class="chips" id="chips"></div>
    <button class="primary" id="save">保存到盒子</button>
  </section>

  <section class="card">
    <div class="card-head">
      <h2>备份</h2>
      <span class="count" id="bkCount">0 个</span>
    </div>
    <ul class="list" id="bkList"><li class="empty">读取中…</li></ul>
    <div class="row">
      <button class="ghost" id="bkReload">刷新</button>
      <button class="ghost danger" id="bkClear">清空全部</button>
    </div>
    <p class="hint">改 hosts 前会自动存一份；恢复前会先把当前 hosts 再存一份，不会越恢复越少</p>
  </section>

  <details class="card" id="adv">
    <summary>高级 · 全文编辑</summary>
    <div class="body">
      <p class="hint" style="margin:0 0 9px">每行一条「IP 域名」，以 # 开头为注释行。长行不会自动折行。</p>
      <textarea id="raw" wrap="off" spellcheck="false" autocapitalize="off"></textarea>
      <div class="row">
        <button class="primary" id="saveRaw">保存全文</button>
        <button class="ghost" id="reloadRaw">重新加载</button>
      </div>
    </div>
  </details>
</main>

<footer>写入后自动备份到 /sdcard/hostbox<br>名字里的 v 序号是递增的，删掉别的也不会重排</footer>

<div id="toast"></div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var entries = [];
  var backups = [];
  var activeHost = null;
  var rawLoaded = false;
  var toastTimer = null;

  function toast(msg, ok){
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'show ' + (ok === false ? 'err' : 'ok');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.className = ''; }, 2600);
  }

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function setPill(text, ok){
    var p = $('#pill');
    p.textContent = text;
    p.className = 'pill' + (ok ? '' : ' err');
  }

  function render(){
    var list = $('#list');
    list.innerHTML = '';
    $('#count').textContent = entries.length + ' 条';

    if (!entries.length){
      var e = el('li', 'empty', '还没有自定义解析\n用下面的表单添加第一条吧');
      e.style.whiteSpace = 'pre-line';
      list.appendChild(e);
      $('#chips').innerHTML = '';
      return;
    }

    entries.forEach(function(it){
      var li = el('li', 'item' + (it.host === activeHost ? ' active' : ''));
      var meta = el('div', 'meta');
      meta.appendChild(el('div', 'host', it.host));
      var ipLine = el('div', 'ip');
      ipLine.appendChild(el('b', null, it.ip));
      if (it.comment) ipLine.appendChild(document.createTextNode('  ·  ' + it.comment));
      meta.appendChild(ipLine);
      li.appendChild(meta);

      var del = el('button', 'del', '✕');
      del.setAttribute('aria-label', '删除 ' + it.host);
      del.addEventListener('click', function(ev){
        ev.stopPropagation();
        if (!confirm('删除 ' + it.host + ' 这条解析？\n（会自动备份当前 hosts）')) return;
        post('/api/delete', 'domain=' + encodeURIComponent(it.host))
          .then(function(){ toast('已删除 ' + it.host); activeHost = null; refresh(); })
          .catch(function(m){ toast(m, false); });
      });
      li.appendChild(del);

      li.addEventListener('click', function(){
        activeHost = it.host;
        $('#ip').value = it.ip;
        $('#domain').value = it.host;
        render();
        $('#ip').scrollIntoView({behavior:'smooth', block:'center'});
        $('#ip').focus();
      });
      list.appendChild(li);
    });

    // 域名快捷芯片
    var chips = $('#chips');
    chips.innerHTML = '';
    entries.slice(0, 12).forEach(function(it){
      var c = el('span', 'chip', it.host);
      c.addEventListener('click', function(){
        activeHost = it.host;
        $('#domain').value = it.host;
        $('#ip').value = it.ip;
        render();
      });
      chips.appendChild(c);
    });

    var dl = $('#domains');
    dl.innerHTML = '';
    entries.forEach(function(it){
      var o = document.createElement('option');
      o.value = it.host;
      dl.appendChild(o);
    });
  }

  function post(path, body){
    return fetch(path, {
      method:'POST',
      // X-HostBox 是写操作的通行证：设备端只认带这个头的 POST。
      // 别的网页（跨站表单）发不出自定义头，也就改不了你的 hosts。
      headers:{
        'Content-Type':'application/x-www-form-urlencoded',
        'X-HostBox':'1'
      },
      body:body
    }).then(function(r){
      return r.text().then(function(t){
        if (!r.ok) throw new Error(t || ('HTTP ' + r.status));
        return t;
      });
    });
  }

  // ---------- 备份 ----------
  function renderBackups(){
    var ul = $('#bkList');
    ul.innerHTML = '';
    $('#bkCount').textContent = backups.length + ' 个';
    $('#bkClear').disabled = !backups.length;

    if (!backups.length){
      var e = el('li', 'empty', '还没有备份\n改一次 hosts 就会自动存一份');
      e.style.whiteSpace = 'pre-line';
      ul.appendChild(e);
      return;
    }

    backups.forEach(function(b){
      // 这一项本身当容器：上面一行是名字+按钮，点「看」时把内容挂在这一项里
      var li = el('li', 'item bk');
      var row = el('div', 'bkrow');
      var meta = el('div', 'meta');
      meta.appendChild(el('div', 'host', b.text));
      row.appendChild(meta);

      var acts = el('div', 'acts');

      var view = el('button', 'act', '看');
      view.setAttribute('aria-label', '查看 ' + b.text + ' 的内容');
      view.addEventListener('click', function(){
        var open = li.querySelector('pre.raw');
        if (open){ open.remove(); view.textContent = '看'; return; }   // 再点一下收起
        post('/api/backup/get', 'name=' + encodeURIComponent(b.name))
          .then(function(txt){
            var pre = document.createElement('pre');
            pre.className = 'raw';
            pre.textContent = txt && txt.length ? txt : '（这份备份是空的）';
            li.appendChild(pre);
            view.textContent = '收';
          })
          .catch(function(m){ toast(m.message || m, false); });
      });
      acts.appendChild(view);

      var restore = el('button', 'act', '恢复');
      restore.addEventListener('click', function(){
        if (!confirm('恢复到这份备份？\n' + b.text + '\n\n当前 hosts 会先自动备份一份')) return;
        post('/api/backup/restore', 'name=' + encodeURIComponent(b.name))
          .then(function(){ toast('已恢复 ' + b.text); refresh(); })
          .catch(function(m){ toast(m.message || m, false); });
      });
      acts.appendChild(restore);

      var rename = el('button', 'act', '改名');
      rename.addEventListener('click', function(){
        var v = prompt('给这份备份起个名字\n（例：改 emby 前 / 加了奈飞）', b.label || '');
        if (v === null) return;
        post('/api/backup/rename',
             'name=' + encodeURIComponent(b.name) + '&label=' + encodeURIComponent(v))
          .then(function(){ toast('已改名'); loadBackups(); })
          .catch(function(m){ toast(m.message || m, false); });
      });
      acts.appendChild(rename);

      var del = el('button', 'act warn', '✕');
      del.setAttribute('aria-label', '删除备份 ' + b.text);
      del.addEventListener('click', function(){
        if (!confirm('删除这份备份？\n' + b.text + '\n\n只删备份，不影响当前 hosts')) return;
        post('/api/backup/delete', 'name=' + encodeURIComponent(b.name))
          .then(function(){ toast('已删除 ' + b.text); loadBackups(); })
          .catch(function(m){ toast(m.message || m, false); });
      });
      acts.appendChild(del);

      row.appendChild(acts);
      li.appendChild(row);
      ul.appendChild(li);
    });
  }

  /** 单独刷备份：改名/删除不会动当前 hosts，没必要整页刷新 */
  function loadBackups(){
    return fetch('/api/backups', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(list){ backups = list || []; renderBackups(); })
      .catch(function(){ /* 连不上就保持上一次的列表 */ });
  }

  function refresh(){
    setPill('同步中', true);
    return fetch('/api/state', {cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(st){
        entries = st.entries || [];
        $('#boxIp').textContent = st.ip ? (st.ip + ':' + st.port) : '未连接网络';
        setPill('✔ 已连接', true);
        render();
        loadBackups();          // 每次写入都会多一份备份，顺便一起刷新
        if ($('#adv').open){ loadRaw(); }
      })
      .catch(function(e){
        setPill('连接失败', false);
        toast('读取失败：' + e.message, false);
      });
  }

  function loadRaw(){
    return fetch('/api/raw', {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(t){ $('#raw').value = t; rawLoaded = true; });
  }

  function isIp(v){
    if (/^(\d{1,3}\.){3}\d{1,3}$/.test(v)){
      return v.split('.').every(function(p){ return +p <= 255; });
    }
    return v.indexOf(':') >= 0 && /^[0-9a-fA-F:]+$/.test(v);
  }

  $('#save').addEventListener('click', function(){
    var ip = $('#ip').value.trim();
    var d = $('#domain').value.trim();
    if (!isIp(ip)) return toast('IP 格式不对，检查一下', false);
    if (!/^[A-Za-z0-9._\-]+$/.test(d)) return toast('域名格式不对，检查一下', false);
    var btn = this;
    btn.disabled = true;
    post('/api/set', 'ip=' + encodeURIComponent(ip) + '&domain=' + encodeURIComponent(d))
      .then(function(){
        toast('已保存 ' + d + ' → ' + ip);
        $('#ip').value = '';
        $('#domain').value = '';
        activeHost = null;
        return refresh();
      })
      .catch(function(m){ toast(m.message || m, false); })
      .then(function(){ btn.disabled = false; });
  });

  $('#bkReload').addEventListener('click', function(){
    loadBackups().then(function(){ toast('备份列表已刷新'); });
  });

  $('#bkClear').addEventListener('click', function(){
    if (!backups.length) return;
    if (!confirm('清空全部 ' + backups.length + ' 个备份？\n\n清空后就回滚不了了，'
                 + '不确定的话先恢复到某一份再清空')) return;
    var btn = this;
    btn.disabled = true;
    post('/api/backup/clear', '')
      .then(function(){ toast('备份已清空'); loadBackups(); })
      .catch(function(m){ toast(m.message || m, false); })
      .then(function(){ btn.disabled = false; });
  });

  $('#adv').addEventListener('toggle', function(){
    if (this.open && !rawLoaded){ loadRaw().catch(function(e){ toast('读取失败', false); }); }
  });

  $('#saveRaw').addEventListener('click', function(){
    var btn = this;
    btn.disabled = true;
    post('/api/raw', $('#raw').value)
      .then(function(t){ toast('✔ ' + t); refresh(); })
      .catch(function(m){ toast(m.message || m, false); })
      .then(function(){ btn.disabled = false; });
  });

  $('#reloadRaw').addEventListener('click', function(){
    loadRaw().then(function(){ toast('已重新加载当前 hosts'); })
            .catch(function(){ toast('读取失败', false); });
  });

  // 从其它页面返回（切后台再回来）时自动同步一次
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) refresh();
  });

  refresh();
})();
</script>
</body>
</html>
