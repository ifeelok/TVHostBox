name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 打 tag 时需要创建 Release 并上传 APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore (from GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.HOSTBOX_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hostbox.keystore"

      - name: Build release APK
        env:
          HOSTBOX_KEYSTORE: ${{ runner.temp }}/hostbox.keystore
          HOSTBOX_STORE_PASS: ${{ secrets.HOSTBOX_STORE_PASS }}
          HOSTBOX_KEY_ALIAS: hostbox
          HOSTBOX_KEY_PASS: ${{ secrets.HOSTBOX_KEY_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/*.apk TVHostBox-v1.0.0.apk
          ls -lh TVHostBox-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVHostBox-apk
          path: TVHostBox-v1.0.0.apk

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TVHostBox-v1.0.0.apk
