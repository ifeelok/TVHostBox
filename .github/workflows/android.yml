name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 打 tag 时需要创建 Release 并上传 APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing secrets (strip whitespace)
        env:
          RAW_STORE: ${{ secrets.HOSTBOX_STORE_PASS }}
          RAW_KEY: ${{ secrets.HOSTBOX_KEY_PASS }}
          RAW_B64: ${{ secrets.HOSTBOX_KEYSTORE_BASE64 }}
        run: |
          STORE=$(printf '%s' "$RAW_STORE" | tr -d '[:space:]')
          KEY=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          echo "store_pass_len=${#STORE} key_pass_len=${#KEY} ks_b64_len=${#RAW_B64}"
          echo "HOSTBOX_STORE_PASS=$STORE" >> "$GITHUB_ENV"
          echo "HOSTBOX_KEY_PASS=$KEY" >> "$GITHUB_ENV"
          printf '%s' "$RAW_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/hostbox.keystore"
          md5sum "$RUNNER_TEMP/hostbox.keystore"

      - name: Extract version from git tag
        run: |
          # tag v1.0.4 → 版本名 1.0.4；非 tag 构建（push/PR）用短 SHA 兜底标记
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          HOSTBOX_KEYSTORE: ${{ runner.temp }}/hostbox.keystore
          HOSTBOX_KEY_ALIAS: hostbox
        run: gradle assembleRelease --no-daemon -PappVersionName="$APP_VERSION"

      - name: Rename APK (version from git tag)
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/release/*.apk "TVHostBox-$VERSION.apk"
          ls -lh "TVHostBox-$VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVHostBox-apk
          path: TVHostBox-*.apk

      - name: Attach to GitHub Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TVHostBox-*.apk
